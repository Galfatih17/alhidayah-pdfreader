name: Build Android TWA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "android-twa/**"
      - ".github/workflows/build-twa.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli@1.27.0

      - name: Configure Android build tools
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"

      - name: Check one-time setup and signing secrets
        working-directory: android-twa
        env:
          TWA_KEYSTORE_BASE64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f gradlew ]; then
            echo "Bubblewrap project is not initialized yet. Follow TWA_SETUP.md and commit android-twa/ first."
            exit 1
          fi
          if [ -z "$TWA_KEYSTORE_BASE64" ] || [ -z "$BUBBLEWRAP_KEYSTORE_PASSWORD" ] || [ -z "$BUBBLEWRAP_KEY_PASSWORD" ]; then
            echo "Add TWA_KEYSTORE_BASE64, TWA_KEYSTORE_PASSWORD, and TWA_KEY_PASSWORD as GitHub Actions secrets."
            exit 1
          fi
          printf '%s' "$TWA_KEYSTORE_BASE64" | base64 --decode > android.keystore

      - name: Build signed APK and App Bundle
        working-directory: android-twa
        run: npx --yes @bubblewrap/cli@1.27.0 build --manifest=twa-manifest.json --signingKeyPath=android.keystore --signingKeyAlias=android

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: Alhidayah-TWA-Android
          path: |
            android-twa/app-release-signed.apk
            android-twa/app-release-bundle.aab
          if-no-files-found: error