name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: bun install

      - name: Build Web App
        run: bun run build

      - name: Setup Capacitor & Sync Android
        run: |
          bun add @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Al Hidayah PDF Reader" "com.alhidayah.pdfreader" --web-dir dist
          npx cap add android
          npx cap sync

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlHidayah-PDFReader-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
